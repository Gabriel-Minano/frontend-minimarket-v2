<section class="w-[min(26rem,calc(100vw-2rem))] rounded-lg border border-gray-200 bg-white p-6 shadow-sm sm:p-8">
    <p class="mb-2 font-bold text-orange-700">MaxiGo POS</p>
    <h1 class="titulo-pagina">Iniciar sesión</h1>
    <form class="mt-6 space-y-4" #form="ngForm" (ngSubmit)="ingresar()">
        <div class="campo">
            <label for="email">Correo electrónico</label>
            <input class="control" id="email" type="email" name="email" [(ngModel)]="email" autocomplete="username" required email />
        </div>

        <div class="campo">
            <label for="password">Contraseña</label>
            <input class="control" id="password" type="password" name="password" [(ngModel)]="password" autocomplete="current-password"
                required />
        </div>

        @if (error()) {
        <p class="mensaje" role="alert">{{ error() }}</p>
        }

        <button class="boton boton-primario w-full" type="submit" [disabled]="form.invalid || cargando()">
            {{ cargando() ? 'Ingresando...' : 'Ingresar' }}
        </button>
    </form>
</section>
