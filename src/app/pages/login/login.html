<h1>Iniciar sesión</h1>
<form #form="ngForm" (ngSubmit)="ingresar()">
    <div>
        <label for="email">Correo electrónico</label>
        <input id="email" type="email" name="email" [(ngModel)]="email" autocomplete="username" required email />
    </div>

    <div>
        <label for="password">Contraseña</label>
        <input id="password" type="password" name="password" [(ngModel)]="password" autocomplete="current-password"
            required />
    </div>

    @if (error()) {
    <p role="alert">{{ error() }}</p>
    }

    <button type="submit" [disabled]="form.invalid || cargando()">
        {{ cargando() ? 'Ingresando...' : 'Ingresar' }}
    </button>
</form>
